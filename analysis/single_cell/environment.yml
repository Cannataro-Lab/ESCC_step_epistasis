name: escc_analysis
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.10
  
  # Core scientific computing
  - numpy=1.24
  - pandas=2.0
  - scipy=1.11
  
  # Single-cell analysis
  - scanpy=1.9.6
  - anndata=0.10
  - leidenalg=0.10
  - python-igraph=0.11
  
  # Plotting
  - matplotlib=3.8
  - seaborn=0.13
  
  # Utilities
  - tqdm
  - numba
  - packaging
  
  # For data download
  - wget
  - tar
  - gzip
  
  # Optional but recommended
  - jupyterlab
  - ipykernel
  
  # Install via pip if needed
  - pip
  - pip:
    - adjustText  # for better plot labels
    - harmonypy   # if you want batch correction
